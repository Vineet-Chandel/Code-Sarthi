events {}

http {

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:3000;
    }

 # Redirect ALL HTTP traffic to HTTPS
    server {
        listen 80;
        server_name codesarthi.in www.codesarthi.in;

        return 301 https://codesarthi.in$request_uri;
    }

   # Redirect HTTPS www -> HTTPS non-www
    server {
        listen 443 ssl http2;
        server_name www.codesarthi.in;

        ssl_certificate     /etc/letsencrypt/live/codesarthi.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/codesarthi.in/privkey.pem;

        return 301 https://codesarthi.in$request_uri;
    }



    server {
          listen 443 ssl http2;
        server_name codesarthi.in;

        ssl_certificate     /etc/letsencrypt/live/codesarthi.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/codesarthi.in/privkey.pem;

        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
